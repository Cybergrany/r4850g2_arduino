[platformio]
default_envs = mega2560_display_test
src_dir = .

[env:mega2560_display_test]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
  adafruit/Adafruit ILI9341@1.6.3
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
