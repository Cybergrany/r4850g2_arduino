[platformio]
default_envs = mega2560

[env]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; Keep the monitor from intentionally asserting the USB bridge's reset lines.
; Some USB drivers still pulse them on open; this does not alter upload reset.
monitor_dtr = 0
monitor_rts = 0
; Keep switch lookup tables out of scarce AVR SRAM (flash branches instead).
build_flags = -fno-tree-switch-conversion
lib_ldf_mode = chain+
lib_deps = sandeepmistry/CAN@0.3.1

; 500 kHz display + wheel + full serial console; touch disabled.
[env:mega2560]
build_flags = ${env.build_flags} -DPSU_ENABLE_TOUCH=0
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ILI9341@1.6.3
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  paulstoffregen/TimerOne@1.2.0

; No screen, wheel, Wire, TimerOne or menu libraries needed.
[env:mega2560_serial]
build_flags = ${env.build_flags} -DPSU_ENABLE_DISPLAY=0 -DPSU_ENABLE_ENCODER=0

; Group overview cycles pages automatically; configuration is via serial.
[env:mega2560_display]
build_flags = ${env.build_flags} -DPSU_ENABLE_ENCODER=0
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ILI9341@1.6.3
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4

; Local monitoring and V/A editing; commission groups with a serial build first.
[env:mega2560_local]
extends = env:mega2560
build_flags = ${env.build_flags} -DPSU_ENABLE_SERIAL=0

; Embedded use: no UI. Can reuse EEPROM saved using the serial-enabled build.
[env:mega2560_minimal]
build_flags = ${env.build_flags} -DPSU_ENABLE_SERIAL=0 -DPSU_ENABLE_DISPLAY=0 -DPSU_ENABLE_ENCODER=0

; XPT2046 sampling uses the existing SPI library; no additional GUI library.
[env:mega2560_touch]
extends = env:mega2560_display
build_flags = ${env.build_flags} -DPSU_ENABLE_ENCODER=0 -DPSU_ENABLE_TOUCH=1

[env:mega2560_touch_wheel]
extends = env:mega2560
build_flags = ${env.build_flags} -DPSU_ENABLE_TOUCH=1

; CAN is deliberately absent from these dependency lists and object files.
[env:mega2560_ui_debug]
build_flags = ${env.build_flags} -DPSU_UI_DEBUG=1
lib_deps =
  adafruit/Adafruit ILI9341@1.6.3
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  paulstoffregen/TimerOne@1.2.0
lib_ignore = CAN

[env:mega2560_touch_debug]
build_flags = ${env.build_flags} -DPSU_UI_DEBUG=1 -DPSU_ENABLE_TOUCH=1 -DPSU_ENABLE_ENCODER=0
lib_deps =
  adafruit/Adafruit ILI9341@1.6.3
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
lib_ignore = CAN

[env:mega2560_touch_local]
extends = env:mega2560_touch
build_flags = ${env.build_flags} -DPSU_ENABLE_SERIAL=0 -DPSU_ENABLE_TOUCH=1 -DPSU_ENABLE_ENCODER=0

[env:mega2560_touch_debug_local]
extends = env:mega2560_touch_debug
build_flags = ${env.build_flags} -DPSU_ENABLE_SERIAL=0 -DPSU_UI_DEBUG=1 -DPSU_ENABLE_TOUCH=1 -DPSU_ENABLE_ENCODER=0

; Latching ENABLE_IN switch on D26 to GND; configurable in ControlConfig.h.
[env:mega2560_touch_enable]
extends = env:mega2560_touch
build_flags = ${env.build_flags} -DPSU_ENABLE_ENCODER=0 -DPSU_ENABLE_TOUCH=1 -DPSU_ENABLE_ENABLE_IN=1

; Optional external fan driver on D6; ENABLE_IN remains on D26.
[env:mega2560_touch_fan]
extends = env:mega2560_touch_enable
build_flags = ${env:mega2560_touch_enable.build_flags} -DPSU_FAN_PWM_PIN=6

; Serial-only bench control plus a four-wire fan, no ENABLE_IN or local UI.
[env:mega2560_serial_fan]
extends = env:mega2560_serial
build_flags = ${env:mega2560_serial.build_flags} -DPSU_FAN_PWM_PIN=6

; Common active-HIGH AC permissive on D27; Mega supply must remain upstream.
[env:mega2560_serial_cutoff]
extends = env:mega2560_serial
build_flags = ${env:mega2560_serial.build_flags} -DPSU_CHG_ALLOW_PIN=27

[env:mega2560_touch_cutoff]
extends = env:mega2560_touch_fan
build_flags = ${env:mega2560_touch_fan.build_flags} -DPSU_CHG_ALLOW_PIN=27

; Independent active-HIGH warning/error/PSU_ACTIVE status outputs. Unused by default.
[env:mega2560_serial_alerts]
extends = env:mega2560_serial
build_flags = ${env:mega2560_serial.build_flags} -DPSU_WARNING_PIN=28 -DPSU_ERROR_PIN=29 -DPSU_ACTIVE_PIN=30

[env:mega2560_touch_alerts]
extends = env:mega2560_touch_cutoff
build_flags = ${env:mega2560_touch_cutoff.build_flags} -DPSU_WARNING_PIN=28 -DPSU_ERROR_PIN=29 -DPSU_ACTIVE_PIN=30

; Current bench wiring: display + wheel + serial, no touch, and four outputs.
; CHG_ALLOW D27, WARNING D28, ERROR D29, PSU_ACTIVE D30.
[env:mega2560_wheel_alerts]
extends = env:mega2560
build_flags = ${env:mega2560.build_flags} -DPSU_CHG_ALLOW_PIN=27 -DPSU_WARNING_PIN=28 -DPSU_ERROR_PIN=29 -DPSU_ACTIVE_PIN=30 -DPSU_ENABLE_ENABLE_IN=1
