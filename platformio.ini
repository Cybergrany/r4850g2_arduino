[platformio]
default_envs = mega2560

[env]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; Keep the monitor from intentionally asserting the USB bridge's reset lines.
; Some USB drivers still pulse them on open; this does not alter upload reset.
monitor_dtr = 0
monitor_rts = 0
lib_ldf_mode = chain+
lib_deps = sandeepmistry/CAN@0.3.1

; Display + wheel + optional full serial console.
[env:mega2560]
lib_deps =
  ${env.lib_deps}
  greiman/SSD1306Ascii@1.3.5
  0xpit/ClickEncoder@0.0.0-alpha+sha.d6d5738fdf
  paulstoffregen/TimerOne@1.2.0

; No screen, wheel, Wire, TimerOne or menu libraries needed.
[env:mega2560_serial]
build_flags = -DPSU_ENABLE_DISPLAY=0 -DPSU_ENABLE_ENCODER=0

; Display acts as a monitor; configuration is via serial.
[env:mega2560_display]
build_flags = -DPSU_ENABLE_ENCODER=0
lib_deps =
  ${env.lib_deps}
  greiman/SSD1306Ascii@1.3.5

; Local monitoring only, serial compiled out. Commission with a serial build first.
[env:mega2560_local]
extends = env:mega2560
build_flags = -DPSU_ENABLE_SERIAL=0

; Embedded use: no UI. Can reuse EEPROM saved using the serial-enabled build.
[env:mega2560_minimal]
build_flags = -DPSU_ENABLE_SERIAL=0 -DPSU_ENABLE_DISPLAY=0 -DPSU_ENABLE_ENCODER=0
